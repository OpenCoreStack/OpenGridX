name: Weekly full test run

# Catches drift that no commit introduces: new browser builds, and new React / Vite / exceljs /
# jspdf releases within the fixtures' semver ranges (`--fresh` ignores the fixture lockfiles).
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Unit and browser tests
        run: npm run test:all

      - name: Package smoke suite (fixture dependencies re-resolved to the latest in range)
        run: npm run test:smoke -- --fresh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
