name: Deploy OpenGridX Demo
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Node ⚙️
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies 📦
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check (lib, tests, demo)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser tests
        run: npm run test:browser

      - name: Build Demo 🚀
        run: npm run build

      - name: Prepare Deployment Directory 📂
        run: |
          mkdir -p deploy-out
          cp -r demo/dist/* deploy-out/
          cp deploy-out/index.html deploy-out/404.html
          cp llms.txt deploy-out/
          touch deploy-out/.nojekyll

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy-out
          branch: gh-pages
