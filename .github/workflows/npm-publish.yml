name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check (lib, tests, demo)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        # The Ubuntu mirror behind --with-deps sometimes stalls (PRs #15, #16, #17). apt retries
        # stalled downloads and waits for the dpkg lock; each attempt gets 6 minutes, and the
        # root apt-get that timeout cannot reach is stopped before the next one.
        timeout-minutes: 20
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nDPkg::Lock::Timeout "120";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-retries > /dev/null
          for attempt in 1 2 3; do
            timeout 6m npx playwright install --with-deps chromium firefox webkit && exit 0
            echo "Playwright install attempt $attempt stalled or failed, retrying"
            sudo pkill -9 -x apt-get || true
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Browser tests
        run: npm run test:browser

      - name: Build
        run: npm run build

      - name: Build library (fails if React is bundled)
        run: npm run build:lib

      - name: Package contents and size budget
        run: npm run check:package

      - name: Versions agree (llms.txt, CLAUDE.md, CHANGELOG vs package.json)
        run: npm run check:versions

      - name: Package smoke suite (packed tarball in React 18 and 19 apps)
        run: npm run test:smoke -- --skip-lib

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
