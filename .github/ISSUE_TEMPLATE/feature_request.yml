name: Feature request
description: Suggest a new feature or an improvement
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: Props, `GridColDef` options, `apiRef` methods, or UI you have in mind.
      render: tsx
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you open a PR for this?
      options: ["Yes", "Maybe, with guidance", "No"]
